    <h1>Feedback form</h1>
    <form action="#" method="#">
      <label name="firstname">First Name :</label>
      <input type="text" placeholder="Enter Your First name" /><br /><br />

      <label name="lastname">Last Name :</label>
      <input type="text" placeholder="Enter Your Last name" /><br /><br />

      <label name="email">Email :</label>
      <input type="email" placeholder="abc@example.com" /><br /><br />

      <label name="tellno">Telephone Number :</label>
      <input type="tel" placeholder="Enter Your Telephone Number" /><br /><br />

      <label name="age">Age :</label>
      <input type="number" placeholder="Enter Your Age" /><br /><br />

      <label name="gender">Select Your Gender :</label>
      <input type="radio" name="gender" value="male" />Male
      <input type="radio" name="gender" value="female" />Female<br /><br />

      <label name="Favfood">Select Your Favourite Food : </label>
      <input type="checkbox" />Pizza <input type="checkbox" />Burger
      <input type="checkbox" />Momo<br /><br />

      <label>Message</label>
      <textarea></textarea>

      <input type="submit" />
      <button>Submit</button>

      <!-- <select name="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>

    </form>
